<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Porto Verde — an open-world crime game</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0e1420; font-family: 'Segoe UI', system-ui, sans-serif; color: #e8e0cc; }
  canvas { display: block; }
  .hud { position: fixed; top: 12px; left: 12px; display: flex; flex-wrap: wrap; gap: 8px; z-index: 10; max-width: 60vw; }
  .pill { background: rgba(10, 14, 20, 0.72); border: 1px solid rgba(232, 224, 204, 0.25); border-radius: 20px; padding: 6px 12px; font-size: 14px; font-weight: 600; }
  #money { color: #7dd87d; }
  #wanted { color: #ff5555; }
  #minimap { position: fixed; right: 14px; bottom: 14px; width: 180px; height: 180px; border-radius: 50%; border: 2px solid rgba(232, 224, 204, 0.4); z-index: 10; background: rgba(10, 14, 20, 0.6); }
  #bigmap { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 640px; height: 640px; border-radius: 50%; border: 3px solid rgba(232, 224, 204, 0.5); z-index: 20; background: rgba(10, 14, 20, 0.9); }
  .dialog { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); width: min(560px, 90vw); background: rgba(10, 14, 20, 0.88); border: 1px solid #e8c33c; border-radius: 10px; padding: 14px 18px; z-index: 15; display: none; }
  .dialog b { color: #e8c33c; font-size: 15px; }
  .dialog p { margin: 6px 0; font-size: 15px; line-height: 1.45; }
  .dialog span { font-size: 12px; opacity: 0.6; }
  .prompt { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); background: rgba(10, 14, 20, 0.8); border: 1px solid rgba(232, 224, 204, 0.4); border-radius: 8px; padding: 6px 14px; font-size: 14px; font-weight: 600; z-index: 12; display: none; }
  .toast { position: fixed; left: 50%; top: 64px; transform: translateX(-50%); background: rgba(10, 14, 20, 0.85); border-radius: 8px; padding: 8px 16px; font-size: 14px; z-index: 12; display: none; }
  .card { position: fixed; left: 50%; top: 32%; transform: translate(-50%, -50%); text-align: center; background: rgba(10, 14, 20, 0.9); border: 2px solid #e8c33c; border-radius: 12px; padding: 22px 40px; z-index: 18; display: none; }
  .card b { font-size: 28px; color: #e8c33c; letter-spacing: 2px; }
  .card p { margin-top: 6px; font-size: 16px; }
  .wasted { position: fixed; inset: 0; background: rgba(40, 0, 0, 0.75); display: none; z-index: 30; text-align: center; padding-top: 30vh; }
  .wasted h1 { font-size: 72px; color: #ff4444; letter-spacing: 10px; }
  .wasted p { margin-top: 12px; font-size: 18px; }
  .hint { position: fixed; left: 12px; bottom: 14px; background: rgba(10, 14, 20, 0.72); border-radius: 8px; padding: 8px 12px; font-size: 13px; max-width: 420px; z-index: 10; display: none; }
  .menu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: linear-gradient(rgba(10, 14, 20, 0.45), rgba(10, 14, 20, 0.75)); z-index: 40; }
  .menu h1 { font-size: 84px; letter-spacing: 14px; color: #e8c33c; text-shadow: 0 4px 24px rgba(0, 0, 0, 0.8); }
  .menu p { font-size: 18px; margin-top: 10px; }
  .menu .sub { color: #ff9a4a; font-weight: 600; }
  .menu button { margin-top: 26px; font-size: 22px; font-weight: 700; letter-spacing: 3px; padding: 14px 44px; border-radius: 10px; border: none; background: #e8c33c; color: #14100a; cursor: pointer; }
  .menu button:hover { background: #ffd24a; }
  .menu .controls { font-size: 13px; opacity: 0.85; line-height: 1.7; margin-top: 22px; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<script type="module" src="./src/main.js"></script>
</body>
</html>
